name: Build Kantong Kejutan APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source archive
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: |
          test -f kantong-kejutan.zip
          unzip -q kantong-kejutan.zip -d extracted
          test -d extracted/kantong-kejutan

      - name: Install Capacitor and create Android project
        working-directory: extracted/kantong-kejutan
        run: |
          npm install --save-exact @capacitor/core@7 @capacitor/android@7
          npm install --save-dev --save-exact @capacitor/cli@7
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: extracted/kantong-kejutan/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kantong-kejutan-debug-apk
          path: extracted/kantong-kejutan/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
